<style>
body { margin: 0; background: #f4f4f1; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { body { background: #111614; color: #e8ece9; } }
#gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
#gate .card { max-width: 380px; width: 100%; text-align: center; }
#gate .gate-mark svg { display: block; margin: 0 auto 14px; }
#gate .gate-word { font: 700 40px/1 'Barlow Condensed', system-ui, sans-serif; letter-spacing: .03em; text-transform: uppercase; color: #0C2340; margin: 0 0 10px; }
#gate .gate-word span { display: block; font: 600 12px/1.6 'IBM Plex Sans', system-ui, sans-serif; letter-spacing: .32em; color: #4A5550; }
@media (prefers-color-scheme: dark) { #gate .gate-word { color: #fff; } #gate .gate-word span { color: #B8C2BD; } }
#gate p { margin: 0 0 22px; color: #5b6560; }
#gate-btn { display: flex; justify-content: center; min-height: 44px; }
#gate-msg { margin-top: 16px; color: #b3261e; font-size: 14px; }
#gate-load { color: #5b6560; }
#gate .gate-foot { margin: 28px 0 0; font-size: 12.5px; } #gate .gate-foot a { color: inherit; }
.pw-userbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: 12.5px; color: #6b7570; padding: 6px max(16px, env(safe-area-inset-right)) 0; }
.pw-userbar button { font-size: 12.5px; padding: 3px 10px; min-height: 0; }
</style>

      <details id="plyo-details"><summary>Plyo days to review</summary><div class="tablewrap"><table id="plyo-table"></table></div></details>
      <details><summary>Every logged day, side by side</summary><div class="tablewrap"><table id="days-table"></table></div></details>

      <p class="note">Counts only days with at least one throw in the selected throw types. Hover any number for its breakdown by throw type. Mode mph is the whole-number velocity thrown most often. Velocity uses throws with a reading; logged plyos have none. Will's logged plyos are sorted by intensity: 1–3 light/moderate, 4–5 high.</p>

      <p class="lead">Each row goes to the pitcher named on it. Throws already saved are never added twice, so uploading the same file again is safe. If a saved throw has no clock time (the old sheets kept only minutes:seconds), the upload fills in its full time. Names that don't match a pitcher are listed; add them to the Master's <b>PitcherAliases</b> tab and upload again.</p>

    el.innerHTML = L.length ? `<ul class="mtlist">${L.map(x => `<li><b>${nice(x.date)}</b>: ${x.groups.map(g => `${g.count} × ${esc(g.label)} at ${g.mph} mph`).join(', ')}${x.note ? ` <span class="dsub">· ${esc(x.note)}</span>` : ''} <button type="button" class="ghost" data-undo="${esc(x.id)}">Remove</button></li>`).join('')}</ul>` : 'None yet.';
  } catch (e) { el.textContent = e.message || String(e); }
}
let dataWired = false;
async function tsLoad(list) {
  const el = document.getElementById('ts-list'); document.getElementById('ts-who').textContent = PITCHER_NAME;
  try { const L = list || await window.pwCall('listSessions', {pitcherId: PITCHER});
    el.innerHTML = L.length ? `<table><tbody>${L.slice(0, 60).map(x => `<tr><td>${nice(x.date)} <span class="dsub">${esc(String(x.start).slice(0, 5))}–${esc(String(x.end).slice(0, 5))}</span></td><td class="num">${x.warm} warm-up · ${x.live} live</td><td><select data-ts="${esc(x.id)}">${['Side', 'Touch & Feel', 'Game bullpen'].map(o => `<option${o === x.bucket ? ' selected' : ''}>${o}</option>`).join('')}</select></td><td class="dsub">${x.dayType ? 'day type: ' + esc(x.dayType) : ''}</td></tr>`).join('')}</tbody></table>${L.length > 60 ? `<p class="dsub">Showing the latest 60 of ${L.length}.</p>` : ''}` : 'No uploaded Trackman sessions yet.';
  } catch (e) { el.textContent = e.message || String(e); }

function mtStatus(msg, kind = '') { const el = document.getElementById('mt-status'); el.textContent = msg; el.className = 'status ' + kind; }
function renderData() {
  if (!DATA_OK) return;
  if (!dataWired) { dataWired = true;
    const inp = document.getElementById('up-files'), dz = document.getElementById('up-drop');
    inp.addEventListener('change', () => upPick(inp.files));
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', e => upPick(e.dataTransfer.files));
    document.getElementById('mt-date').value = TODAY; document.getElementById('mt-date').max = TODAY;
    document.getElementById('mt-date').addEventListener('change', mtRender);
    const mode = single => { MT.single = single; MT.rows = [mtNewRow()]; mtRender(); };
    document.getElementById('mt-groups').addEventListener('click', () => mode(false)); document.getElementById('mt-single').addEventListener('click', () => mode(true));
    document.getElementById('mt-addrow').addEventListener('click', () => { MT.rows.push(mtNewRow()); mtRender(); });
    const body = document.getElementById('mt-body');
    body.addEventListener('input', e => { const tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k) return; const r = MT.rows[+tr.dataset.i]; r[k] = e.target.value; if (k === 'mph') r.auto = false; if (k === 'cat' && r.auto) r.mph = mtSuggest(r.cat); if (k === 'cat' || k === 'count') mtRender(); });
    body.addEventListener('change', e => { if (e.target.dataset.k === 'cat') { const r = MT.rows[+e.target.closest('tr').dataset.i]; if (r.auto) r.mph = mtSuggest(r.cat); mtRender(); } });
    body.addEventListener('click', e => { const d = e.target.closest('[data-del]'); if (!d) return; MT.rows.splice(+d.dataset.del, 1); if (!MT.rows.length) MT.rows.push(mtNewRow()); mtRender(); });
    document.getElementById('mt-list').addEventListener('click', async e => { const b = e.target.closest('[data-undo]'); if (!b) return; const x = (MT.list || []).find(y => y.id === b.dataset.undo);
      if (!confirm(`Remove the throws added by hand on ${nice(x.date)}? This takes them out of ${PITCHER_NAME}'s workload.`)) return;
      b.disabled = true; try { await window.pwCall('deleteManual', {pitcherId: PITCHER, importId: b.dataset.undo}); mtStatus('Removed. Reload to update the charts.', 'ok'); mtLoadList(); } catch (er) { mtStatus(er.message || String(er), 'err'); b.disabled = false; } });
    document.getElementById('mt-save').addEventListener('click', async () => {
      const date = document.getElementById('mt-date').value, rows = MT.rows.filter(r => r.mph !== '' && (MT.single || parseInt(r.count, 10) > 0)).map(r => ({cat: r.cat, mph: +r.mph, count: MT.single ? 1 : parseInt(r.count, 10), time: r.time || '', pitchType: r.pt || ''}));
      if (!date) { mtStatus('Pick a date first.', 'err'); return; } if (!rows.length) { mtStatus(MT.single ? 'Enter a velocity for each throw.' : 'Enter how many throws and a velocity.', 'err'); return; }
      if (rows.some(r => r.mph < 30 || r.mph > 110)) { mtStatus('Velocities must be between 30 and 110 mph.', 'err'); return; }
      const btn = document.getElementById('mt-save'); btn.disabled = true; btn.textContent = 'Saving…';
      try { const r = await window.pwCall('addThrows', {pitcherId: PITCHER, date, rows, note: document.getElementById('mt-note').value}); mtStatus(`Added ${r.added} estimated throw${r.added === 1 ? '' : 's'} on ${nice(date)}. Reload to update the charts.`, 'ok');
        MT.rows = [mtNewRow()]; document.getElementById('mt-note').value = ''; mtRender(); mtLoadList(); }
      catch (e) { mtStatus(e.message || String(e), 'err'); } finally { btn.disabled = false; btn.textContent = 'Save throws'; } });
    MT.rows = [mtNewRow('side')];
    document.getElementById('ts-list').addEventListener('change', async e => { const sl = e.target.closest('[data-ts]'); if (!sl) return; const st = document.getElementById('ts-status'); sl.disabled = true; st.className = 'status'; st.textContent = 'Saving…';
      try { const r = await window.pwCall('setSession', {pitcherId: PITCHER, sessionId: sl.dataset.ts, bucket: sl.value}); st.className = 'status ok'; st.textContent = `Changed ${r.changed} throws to ${sl.value}. Reload to update the charts.`; tsLoad(r.sessions); }
      catch (er) { st.className = 'status err'; st.textContent = er.message || String(er); sl.disabled = false; } });
  }
  mtRender(); mtLoadList(); tsLoad();
}
function renderPitcherSelect() {
  const ps = document.getElementById('pitcher'); if (!ps) return;
  const tag = x => x.id === 'will' ? ' · from the sheet' : x.id === 'test1' || /^test/.test(x.id) ? ' · test' : ' · no data yet';
  // alphabetical by last name ("De los Santos" sorts under D); test pitchers last
  const last = n => { const t = String(n || '').replace(/,?\s+(jr\.?|sr\.?|ii|iii|iv)$/i, '').trim().split(/\s+/);
    const i = t.findIndex((w, k) => k > 0 && /^(de|del|della|da|di|van|von|la|le|st\.?)$/i.test(w)); return (i > 0 ? t.slice(i) : t.slice(-1)).join(' '); };
  const isTest = x => (x.id === 'test1' || /^test/.test(x.id) || !!x.test) ? 1 : 0;
  const list = PITCHERS.slice().sort((a, b) => (isTest(a) - isTest(b)) || last(a.name).localeCompare(last(b.name), undefined, {sensitivity: 'base'}) || String(a.name).localeCompare(String(b.name)));
  ps.innerHTML = list.map(x => `<option value="${esc(x.id)}" ${x.id === PITCHER ? 'selected' : ''}>${esc(x.name)}${tag(x)}</option>`).join('') + (LIVE_SITE ? '' : '<option value="__add">+ Add a test pitcher…</option>');
}
function confirmSwitch() { return true; }
// Pop-up reminder to save before leaving a pitcher: Save and switch / Switch without saving / Keep editing
let leaving = false;
function saveReminder(msg, save, proceed) {
  document.getElementById('savemodal')?.remove();
  const m = document.createElement('div'); m.id = 'savemodal'; m.className = 'modal-back';
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="savemodal-t"><h3 id="savemodal-t">Save before you switch?</h3><p>${msg}</p><p class="muted" style="font-size:12.5px;margin-top:-4px">Switching reloads the page, so unsaved changes are lost.</p>
    <div class="modal-btns"><button type="button" class="primary" data-a="save" ${db ? '' : 'disabled title="Saving needs the page opened signed in to claude.ai"'}>Save as new version and switch</button><button type="button" data-a="go">Switch without saving</button><button type="button" class="ghost" data-a="stay">Keep editing</button></div><div class="modal-st muted"></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.addEventListener('click', async e => { const a = e.target.closest('[data-a]')?.dataset.a; if (!a && e.target === m) { close(); return; } if (!a) return;
    if (a === 'stay') close();
    if (a === 'go') { close(); proceed(); }
    if (a === 'save') { m.querySelectorAll('button').forEach(b => { b.disabled = true; }); m.querySelector('.modal-st').textContent = 'Saving…'; if (await save()) { close(); proceed(); } else { m.querySelector('.modal-st').textContent = 'Could not save. Check the message in Builder, or switch without saving.'; m.querySelectorAll('button').forEach(b => { b.disabled = false; }); } } });
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  m.querySelector('[data-a="stay"]').focus();
}
// The browser's own warning if the page is closed or reloaded with unsaved edits
window.addEventListener('beforeunload', e => { if (B.dirty && !leaving) { e.preventDefault(); e.returnValue = ''; } });
function alertBox(msg) { const s = document.getElementById('sched-status'); if (s) s.textContent = msg; }
window.matchMedia('(max-width: 640px)').addEventListener('change', () => { if (S.view === 'explore') renderExplore(); if (S.view === 'builder') { renderWeek(); renderForecast(); } });
try { const bm = localStorage.getItem('wl-bmode'); if (bm === 'week' || bm === 'month' || bm === 'day') S.b.mode = bm; else if (isNarrow()) S.b.mode = 'day'; } catch (e) { if (isNarrow()) S.b.mode = 'day'; }
if (LIVE_SITE) { document.querySelector('nav.tabs a[data-view="checks"]').remove(); document.getElementById('view-checks').innerHTML = ''; }
else if (IS_TEST) { document.getElementById('view-checks').innerHTML = '<div class="panel"><p class="note">Checks compare the rebuild with Will\'s Google Sheet, so they only apply to Will.</p></div>'; } else renderChecks();
if (!DATA_OK) { const a = document.querySelector('nav.tabs a[data-view="data"]'); if (a) a.remove(); document.getElementById('view-data').innerHTML = ''; }
setupExplore(); setupPitchTable(); setupMode(); applyRole(); setupBuilder(); setMode(S.b.mode); route();
connectStore();
connectSchedule();
connectMaster();
})();

<script>window.PW_CONFIG = {api: 'https://script.google.com/macros/s/AKfycby7zw3ozPMn_SV-Q6TfdQ9ETjxmy19mR6wgT0I-0QIXpjA5FEzqljtBk8jXQVdsf8SA/exec', clientId: '679974398302-4dihg8s0b2j5cc29ltbc7ugio23juh8e.apps.googleusercontent.com'};</script>
<script>
/* Pitcher Workload: sign-in and connection to the Apps Script server. The app itself is below, unchanged from the prototype. */
(() => {
'use strict';
const CFG = window.PW_CONFIG;
const TOKEN_KEY = 'pw-session';
const $ = id => document.getElementById(id);
const tok = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
const setTok = t => { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

async function post(body) {
  const r = await fetch(CFG.api, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow'});
  if (!r.ok) throw {code: 'network', message: 'The server answered ' + r.status + '.'};
  return r.json();
}
/* Calls made within a few milliseconds of each other go to the server together */
let queue = [], timer = null;
function call(action, args) { return new Promise((res, rej) => { queue.push({action, args: args || {}, res, rej}); if (!timer) timer = setTimeout(flush, 25); }); }
async function flush() {
  const batch = queue; queue = []; timer = null;
  let r;
  try { r = await post({token: tok(), calls: batch.map(c => ({action: c.action, args: c.args}))}); }
  catch (e) { batch.forEach(c => c.rej({code: 'network', message: 'Could not reach the server. Check your connection and try again.'})); return; }
  if (r.error) { if (r.error === 'signin_needed' || r.error === 'not_listed') return gate(r.message); batch.forEach(c => c.rej({code: r.error, message: r.message})); return; }
  r.results.forEach((x, i) => x.ok ? batch[i].res(x.data) : batch[i].rej({code: x.error, message: x.message}));
}

/* The app talks to "claude.use(...)" services; here they are answered by the server instead */
const subs = {};
const snap = docs => ({docs: docs.map(d => ({id: d.id, exists: true, data: () => JSON.parse(JSON.stringify(d.data))}))});
const emit = (name, docs) => (subs[name] || []).forEach(cb => { try { cb(snap(docs)); } catch (e) { console.error(e); } });
const db = {collection: name => ({
  onSnapshot(cb, onErr) { (subs[name] = subs[name] || []).push(cb); call('list', {collection: name}).then(d => cb(snap(d))).catch(e => { if (onErr) onErr(e); }); return () => { subs[name] = (subs[name] || []).filter(x => x !== cb); }; },
  doc: id => ({set: async data => { const r = await call('set', {collection: name, id, data}); emit(name, r.docs); }, delete: async () => { const r = await call('delete', {collection: name, id}); emit(name, r.docs); }}),
  add: async data => { const r = await call('add', {collection: name, data}); emit(name, r.docs); return {id: r.id}; }})};
const mcp = {
  watchTool(server, tool, input, handler, opts) {
    const run = () => call('values', {spreadsheetId: input.spreadsheetId, range: input.range}).then(v => handler({type: 'data', result: {payload: v, cache: null}})).catch(e => handler({type: 'error', error: {code: e.code || 'tool_error', message: e.message || 'Could not read the sheet.'}}));
    run(); const iv = setInterval(run, (opts && opts.refetchInterval) || 300000); return () => clearInterval(iv);
  },
  callTool: (server, tool, input) => call('values', {spreadsheetId: input.spreadsheetId, range: input.range}).then(v => ({payload: v}))};
let ME = null;
const user = {id: async () => ME.email, me: async () => ({id: ME.email, name: ME.name}), isOwner: () => false, canEdit: () => ME.role !== 'player', can: () => ME.role !== 'player'};
window.claude = {use: async n => n === 'db' ? db : n === 'mcp' ? mcp : n === 'user' ? user : null};
window.pwCall = call; /* direct server calls for pages the prototype does not have (device uploads, missed throws) */

/* ---------- sign-in screen ---------- */
let gisReady = false;
function gate(msg) {
  setTok(''); $('app-root') && ($('app-root').hidden = true);
  $('gate').hidden = false; $('gate-msg').textContent = msg || ''; $('gate-load').hidden = true; $('gate-btn').hidden = false;
  const init = () => {
    if (!window.google || !google.accounts || !google.accounts.id) return setTimeout(init, 150);
    if (!gisReady) { google.accounts.id.initialize({client_id: CFG.clientId, callback: onCredential, auto_select: true, cancel_on_tap_outside: false}); gisReady = true; }
    google.accounts.id.renderButton($('gate-btn'), {theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 260});
    google.accounts.id.prompt();
  };
  init();
}
async function onCredential(resp) {
  $('gate-msg').textContent = ''; $('gate-load').hidden = false; $('gate-btn').hidden = true;
  let r; try { r = await post({action: 'signin', idToken: resp.credential}); } catch (e) { r = {error: 'network', message: 'Could not reach the server. Try again.'}; }
  if (r.error) { $('gate-load').hidden = true; $('gate-btn').hidden = false; $('gate-msg').textContent = r.message; return; }
  setTok(r.token); boot();
}
window.pwSignOut = () => { setTok(''); try { google.accounts.id.disableAutoSelect(); } catch (e) {} location.reload(); };

/* ---------- start the app ---------- */
async function boot() {
  if (!tok()) return gate();
  $('gate').hidden = false; $('gate-btn').hidden = true; $('gate-load').hidden = false; $('gate-msg').textContent = '';
  let me, early = null, guess = '';
  try { guess = localStorage.getItem('wl-pitcher') || ''; } catch (e) {}
  // ask for the last pitcher's data in the same request as "who am I": one trip to the server instead of two
  if (guess) { early = call('pitcherData', {pitcherId: guess}); early.catch(() => {}); }
  try { me = await call('me'); } catch (e) { return gate(e.code === 'network' ? e.message : ''); }
  ME = me;
  if (!me.pitchers.length) { $('gate-load').hidden = true; $('gate-msg').textContent = `Signed in as ${me.email}, but no pitchers are assigned to you yet. Ask the admin to add you on the Assignments tab.`; return; }
  let pid = ''; try { pid = localStorage.getItem('wl-pitcher') || ''; } catch (e) {}
  if (!me.pitchers.some(p => p.id === pid)) pid = me.role === 'player' ? me.id : me.pitchers[0].id;
  let D;
  try { D = (early && pid === guess) ? await early.catch(() => call('pitcherData', {pitcherId: pid})) : await call('pitcherData', {pitcherId: pid}); } catch (e) { $('gate-load').hidden = true; $('gate-msg').textContent = e.message || 'Could not load the data.'; return; }
  try { localStorage.setItem('wl-pitcher', pid); } catch (e) {}
  window.__LIVE = {role: me.role, pitchers: me.pitchers, pitcher: pid, me};
  const root = document.createElement('div'); root.id = 'app-root';
  root.appendChild($('app-markup').content.cloneNode(true));
  document.body.appendChild(root);
  const data = document.createElement('script'); data.type = 'application/json'; data.id = 'data'; data.textContent = JSON.stringify(D); document.body.appendChild(data);
  const bar = document.createElement('div'); bar.className = 'pw-userbar'; bar.innerHTML = `<span></span><button type="button">Sign out</button>`; bar.querySelector('span').textContent = me.email; bar.querySelector('button').onclick = window.pwSignOut;
  root.prepend(bar);
  $('gate').hidden = true;
  const s = document.createElement('script'); s.textContent = $('app-code').textContent; document.body.appendChild(s);
}
boot();
})();
